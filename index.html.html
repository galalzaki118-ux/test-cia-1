<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدرّب CIA - الجزء الأول</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#3b5bdb;--acc:#15aabf;--g:#7ac143;--bg:#f3f5fb;--card:#fff;--text:#1f2633;--muted:#6b7385;--line:#e3e8f2;--soft:#f3f6ff;--ok:#1e9e5a;--okbg:#e6f6ec;--bad:#e03131;--badbg:#fdecec;--fs:16px}
body.dark{--bg:#111827;--card:#1b2333;--text:#e6ebf5;--muted:#9aa5b8;--line:#2c3649;--soft:#222c40;--okbg:#14352a;--badbg:#3a1f22}
html{font-size:var(--fs)}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
header{background:linear-gradient(90deg,#3b4fd8,#4c6ef5 55%,#15aabf);color:#fff;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(30,40,90,.25)}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{margin:0;font-size:1.5rem;font-weight:800}
.brand small{opacity:.85;font-size:.95rem}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hb{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:22px;padding:8px 16px;font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer}
.hb:hover{background:rgba(255,255,255,.32)}
.timer{background:rgba(255,255,255,.22);padding:6px 16px;border-radius:22px;font-weight:800;font-size:1.2rem;display:none;direction:ltr}
.timer.warn{background:var(--bad);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.6}}
.wrap{max-width:1200px;margin:20px auto;padding:0 16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 4px 18px rgba(30,40,90,.06);margin-bottom:20px}
.hello{color:var(--muted);font-weight:500}
.panel h2{margin:4px 0 18px;font-size:1.6rem;font-weight:800}
.mut{color:var(--muted);font-size:.95rem}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:linear-gradient(180deg,var(--soft),var(--card));border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.stat b{display:block;font-size:2.1rem;font-weight:800;color:var(--p);margin-bottom:6px}
.stat b.red{color:var(--bad)}
.stat span{color:var(--muted)}
h3.sub{margin:0 0 14px;font-size:1.15rem;font-weight:800}
.drow{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.badge{min-width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3b5bdb,#15aabf);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.1rem}
.dmid{flex:1}
.dmid .t{margin-bottom:6px}
.dmid .t small{color:var(--muted)}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,#4c6ef5,#15aabf);border-radius:9px}
.dnum{min-width:160px;color:var(--muted);font-size:.95rem;text-align:left}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mode{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;cursor:pointer;transition:.2s;box-shadow:0 4px 18px rgba(30,40,90,.05)}
.mode:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(30,40,90,.13)}
.ico{width:58px;height:58px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin-bottom:14px}
.mode h4{margin:0 0 6px;font-size:1.2rem;font-weight:800}
.mode p{margin:0;color:var(--muted);font-size:.95rem;line-height:1.6}
.link{color:var(--muted);cursor:pointer;text-decoration:underline;font-size:.9rem}
.breadcrumb{color:var(--muted);margin-bottom:14px}
.breadcrumb a{color:var(--p);cursor:pointer;font-weight:700}
.secbar{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(90deg,#3b5bdb,#4c6ef5);color:#fff;padding:10px 16px;border-radius:12px;margin:20px 0 12px;font-weight:800}
.secbar .w{background:var(--g);padding:2px 12px;border-radius:20px}
.chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;transition:.2s}
.ch:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(30,40,90,.12)}
.ch.empty{opacity:.55;cursor:default}
.ch.empty:hover{transform:none;box-shadow:none}
.num{display:inline-block;background:var(--p);color:#fff;border-radius:8px;padding:2px 10px;font-weight:700;font-size:.85rem}
.ch h4{margin:10px 0 6px;font-size:1.1rem}
.ch p{margin:0 0 10px;color:var(--muted);font-size:.9rem}
details.acc{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;padding:4px 18px}
details.acc summary{cursor:pointer;padding:12px 0;font-weight:800;font-size:1.05rem}
details.acc summary small{color:var(--muted);font-weight:500}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.btn{border:none;border-radius:10px;padding:10px 20px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;background:var(--p);color:#fff}
.btn:hover{filter:brightness(1.1)}
.btn.sm{padding:7px 16px;font-size:.9rem}
.btn.light{background:var(--soft);color:var(--p);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.field{margin:14px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input{font-family:inherit;font-size:1rem;padding:8px;border-radius:8px;border:1px solid var(--line);width:100px;background:var(--card);color:var(--text)}
.exam{display:grid;grid-template-columns:1fr 260px;gap:18px;align-items:start}
.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
.progress span{display:block;height:100%;background:linear-gradient(90deg,#4c6ef5,#15aabf)}
.qhead{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:10px}
.tag{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px}
.qtext{font-size:1.25rem;font-weight:700;line-height:1.8;border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.opt{border:2px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;cursor:pointer;transition:.15s;background:var(--card)}
.opt:hover{border-color:var(--p);background:var(--soft)}
.opt .row{display:flex;align-items:flex-start;gap:12px;font-size:1.05rem;line-height:1.7}
.opt .letter{min-width:32px;height:32px;border-radius:50%;border:2px solid var(--p);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--p)}
.opt.sel{border-color:var(--p);background:var(--soft)}
.opt.sel .letter{background:var(--p);color:#fff}
.opt.locked{cursor:default}
.opt.locked:hover{background:var(--card);border-color:var(--line)}
.opt.correct,.opt.correct:hover{border-color:var(--ok);background:var(--okbg)}
.opt.correct .letter{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong,.opt.wrong:hover{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:#fff}
.exp{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:.95rem;line-height:1.8;background:var(--card)}
.exp.ok{border-right:4px solid var(--ok)}
.exp.bad{border-right:4px solid var(--bad)}
.exp.ok b{color:var(--ok)}
.exp.bad b{color:var(--bad)}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.pbtn{height:38px;border-radius:8px;border:2px solid var(--line);background:var(--card);color:var(--text);font-family:inherit;font-weight:700;cursor:pointer}
.pbtn.cur{border-color:var(--p);box-shadow:0 0 0 2px var(--acc)}
.pbtn.ans{background:var(--p);color:#fff;border-color:var(--p)}
.pbtn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.pbtn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.side div.s{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)}
.result{text-align:center}
.score{font-size:3.5rem;font-weight:800;margin:10px 0}
.pass{color:var(--ok)}.fail{color:var(--bad)}
@media(max-width:900px){.stats4,.modes{grid-template-columns:repeat(2,1fr)}.exam{grid-template-columns:1fr}}
@media(max-width:560px){.stats4,.modes{grid-template-columns:1fr}.brand small{display:none}.dnum{min-width:0}}
</style>
</head>

<header>
<div class="brand"><h1>مدرّب CIA</h1><small id="qcount"></small></div>
<div class="hbtns"><div class="timer" id="timer">00:00</div><button class="hb" id="themeBtn" onclick="toggleDark()" title="الوضع الليلي">🌙</button><button class="hb" onclick="zoom(1)" title="تكبير الخط">A+</button><button class="hb" onclick="zoom(-1)" title="تصغير الخط">A-</button><button class="hb" onclick="goHome()">🏠 الرئيسية</button></div>
</header>

<script>
const LETTERS=["أ","ب","ج","د","هـ"];
const PASS_MARK=75;
const MIN_PER_Q=1.2;

/* ======== بنك الأسئلة: أضف الدروس والأسئلة داخل كل فصل ======== */
const SECTIONS={A:{name:"القسم (أ) - أسس التدقيق الداخلي",w:"35%"},B:{name:"القسم (ب) - الأخلاقيات والاحترافية",w:"20%"},C:{name:"القسم (ج) - الحوكمة، إدارة المخاطر والرقابة الداخلية",w:"30%"},D:{name:"القسم (د) - مخاطر الاحتيال",w:"15%"}};
function L(id,t){return {id:id,title:t,questions:[]};}
const CHAPTERS=[
{id:1,sec:"A",title:"أساسيات مهنة التدقيق الداخلي",lessons:[
{id:"01.01",title:"مهنة التدقيق الداخلي والمعايير",questions:[
{q:"أيٌّ من المواقف التالية يُظهر على أفضل وجه تطوّر وظيفة التدقيق الداخلي إلى دور استراتيجي؟",
options:["قيام المدققين الداخليين بالتحقق من الموافقات على الفواتير لضمان الامتثال.","قيام المدققين الداخليين بتقديم المشورة للإدارة بشأن إدارة المخاطر وتحسين العمليات.","قيام المدققين الداخليين بمطابقة كشوفات الحسابات البنكية شهريًا.","قيام المدققين الداخليين بالتحقق من الدقة الحسابية لدفاتر الأستاذ."],
answer:1,
exp:["التحقق من موافقات الفواتير نشاط امتثال تقليدي يركّز على فحص المعاملات، ولا يعكس الدور الاستراتيجي للوظيفة.","تقديم المشورة بشأن إدارة المخاطر وتحسين العمليات يعكس تحوّل التدقيق الداخلي إلى شريك استراتيجي يضيف قيمة، وهو ما يتسق مع غرض التدقيق الداخلي في المعايير العالمية 2024: تعزيز قدرة المنظمة على خلق القيمة وحمايتها واستدامتها من خلال خدمات التأكيد والاستشارة والرؤى المبنية على المخاطر.","مطابقة الكشوفات البنكية مهمة محاسبية تشغيلية من مسؤولية الإدارة، وقيام المدقق الداخلي بها قد يُضعف موضوعيته ولا يُعد دورًا استراتيجيًا.","التحقق من الدقة الحسابية لدفاتر الأستاذ نشاط تقليدي يركّز على الأرقام وليس على المخاطر والحوكمة والاستراتيجية."]},
{q:"يقوم مدقق داخلي بتنفيذ مهمة تدقيق تتعلق بمخاطر الاحتيال. أي نوع من إرشادات الإطار المهني الدولي (IPPF) يجب الالتزام به إذا كان نطاق المهمة يشمل موضوع مخاطر محددًا؟",
options:["الإرشادات التكميلية.","الأدلة العالمية لتدقيق التكنولوجيا (GTAGs).","الأدلة الإرشادية العالمية للممارسات.","المعايير الخاصة بمواضيع معينة."],
answer:3,
exp:["الإرشادات التكميلية مسمّى من الإطار السابق، وهي إرشادات موصى بها وغير إلزامية.","أدلة GTAGs جزء من الإرشادات العالمية (Global Guidance) في إطار IPPF 2024، وهي إرشادات موصى بها وغير إلزامية.","الأدلة الإرشادية العالمية للممارسات جزء من الإرشادات العالمية الموصى بها، وليست إلزامية.","في إطار IPPF 2024 العناصر الإلزامية هي المعايير العالمية والمتطلبات الخاصة بمواضيع معينة (Topical Requirements). وتكون المتطلبات الموضوعية إلزامية عندما يشمل نطاق المهمة الموضوع المحدد، ويُقيَّم الالتزام بها ضمن تقييمات الجودة."]},
{q:"تتعاقد منظمة مع مزوّد خدمة خارجي لتنفيذ أنشطة التدقيق الداخلي. وفقًا للمعايير العالمية للتدقيق الداخلي، أي العبارات التالية صحيحة؟",
options:["تنطبق المعايير فقط على المدققين الداخليين العاملين داخل المنظمة.","تنطبق المعايير فقط إذا كان ذلك مطلوبًا بموجب القوانين أو الأنظمة المحلية.","تنطبق المعايير على أي شخص أو جهة تقدّم خدمات التدقيق الداخلي.","تنطبق المعايير فقط على رئيس التدقيق الداخلي."],
answer:2,
exp:["المعايير لا تقتصر على الموظفين الداخليين؛ فهي تشمل أيضًا مزوّدي الخدمة الخارجيين (الإسناد الخارجي أو المشترك).","تطبيق المعايير لا يتوقف على وجود إلزام قانوني؛ وإذا تعارضت القوانين مع المعايير يُلتزم بالقانون ويُفصح عن ذلك، مع الالتزام بباقي المعايير.","تنص المعايير العالمية على أنها تنطبق على أي فرد أو وظيفة تقدّم خدمات التدقيق الداخلي، سواء كانت داخلية أو مسندة خارجيًا أو مشتركة، وفي القطاعين العام والخاص.","المعايير تنطبق على رئيس التدقيق الداخلي وعلى جميع المدققين الداخليين ومزوّدي الخدمة، وليس على الرئيس وحده."]},
{q:"أيٌّ مما يلي يُعدّ أحد الأهداف الرئيسية للمعهد العالمي للمدققين الداخليين (IIA)؟",
options:["الإشراف على أنشطة المدققين الداخليين.","التحقيق في الاتهامات المتعلقة بانتهاك المدققين الداخليين المعتمدين لقواعد السلوك المهني الصادرة عن المعهد العالمي للمدققين الداخليين (IIA).","وضع معايير يجب أن تلتزم بها جميع الشركات.","تعزيز ونشر المعلومات المتعلقة بالتدقيق الداخلي ومواضيع أخرى ذات صلة."],
answer:3,
exp:["المعهد لا يشرف على أنشطة المدققين داخل المنظمات؛ فالإشراف مسؤولية مجلس الإدارة والإدارة العليا ورئيس التدقيق الداخلي.","التحقيق في المخالفات إجراء تأديبي يقوم به المعهد عند الحاجة، لكنه ليس من أهدافه الرئيسية.","المعهد هيئة مهنية وليس جهة تشريعية؛ فلا يملك إلزام جميع الشركات بمعاييره، وإنما يلتزم بها من يقدّم خدمات التدقيق الداخلي ويدّعي التوافق معها.","من الأهداف الرئيسية للمعهد تطوير المهنة وتعزيزها ونشر المعرفة والمعلومات المتعلقة بالتدقيق الداخلي والحوكمة وإدارة المخاطر والرقابة."]},
{q:"وفقًا للاستخدام المعتمد في مهنة التدقيق الداخلي، تشير معايير التدقيق الداخلي العالمية إلى جميع ما يلي، باستثناء:",
options:["عبارات تهدف إلى تمثيل الكيفية التي ينبغي أن تُمارس بها مهنة التدقيق الداخلي.","معايير يتم على أساسها تقييم وقياس عمليات إدارة التدقيق الداخلي.","معايير تحدد الحد الأدنى من التصرفات الأخلاقية التي يجب على المدققين الداخليين اتخاذها.","معايير تنطبق على جميع أنواع إدارات ووظائف التدقيق الداخلي."],
answer:2,
exp:["المعايير تصف الكيفية التي يجب أن تُمارس بها المهنة، وهذا من معانيها المعتمدة.","المعايير تُستخدم أساسًا لتقييم أداء وظيفة التدقيق الداخلي وقياسه، وهذا من معانيها المعتمدة.","تحديد الحد الأدنى من السلوك الأخلاقي هو تقليديًا دور قواعد السلوك المهني (Code of Ethics). ومع دمج الأخلاقيات في المعايير 2024 ضمن المجال الثاني (الأخلاقيات والمهنية)، فهي تُصاغ كمبادئ للسلوك المتوقع وليست حدًا أدنى للتصرفات، لذا هذا هو الاستثناء.","المعايير تنطبق على جميع وظائف التدقيق الداخلي بغض النظر عن حجمها أو قطاعها أو طريقة تقديمها."]},
{q:"تقوم جهة حكومية بتنفيذ مهام تدقيق لبرامج ممولة من خلال المنح. أي من الأساليب التالية يضمن على أفضل وجه الالتزام المهني السليم؟",
options:["تطبيق كلٍّ من المعايير العالمية للتدقيق الداخلي ومعايير التدقيق الحكومي معًا.","تطبيق المعايير العالمية للتدقيق الداخلي فقط.","تطبيق معايير التدقيق الحكومي فقط (الكتاب الأصفر).","الاكتفاء بتطبيق السياسات الداخلية للجهة فقط."],
answer:0,
exp:["في القطاع العام قد تخضع المهام لقوانين ومعايير إضافية مثل معايير التدقيق الحكومي (GAGAS - الكتاب الأصفر) الخاصة بالبرامج الممولة بالمنح. والمعايير العالمية 2024 تعترف بذلك (تطبيق المعايير في القطاع العام)، ويمكن استخدام المعيارين معًا، مما يحقق أفضل التزام مهني.","تطبيق المعايير العالمية وحدها يتجاهل متطلبات التدقيق الحكومي الواجبة على البرامج الممولة بالمنح.","الاقتصار على الكتاب الأصفر يُفقد الوظيفة متطلبات المعايير العالمية للتدقيق الداخلي التي تلتزم بها.","السياسات الداخلية وحدها لا تمثل إطارًا مهنيًا معترفًا به ولا تضمن الالتزام بالمعايير المهنية."]}
]},
{id:"01.02",title:"الغرض من التدقيق الداخلي",questions:[
{q:"يشعر مجلس إدارة إحدى المؤسسات بعدم الرضا لأن وظيفة التدقيق الداخلي ركّزت بصورة شبه كاملة على المعاملات المالية التاريخية. وقد طلب المجلس من الرئيس التنفيذي للتدقيق إعادة تصميم وظيفة التدقيق الداخلي بحيث تعكس بصورة أفضل غرض التدقيق الداخلي وفقًا للمعايير العالمية للتدقيق الداخلي. أيٌّ من التغييرات المقترحة التالية يحقق طلب مجلس الإدارة على أفضل وجه؟",
options:["توسيع نطاق اختبارات المعاملات، وزيادة تكرار إجراء المطابقات البنكية، والتحقق من الدقة الحسابية للسجلات المحاسبية.","تحمّل مسؤولية إدارة المخاطر الجوهرية التي تواجه المؤسسة، ورفع تقارير دورية إلى الإدارة بشأن ما إذا تم التخفيف من تلك المخاطر بنجاح.","التركيز بصورة رئيسية على اكتشاف الاحتيال في القوائم المالية، بما يسمح للمدقق الخارجي بتقليل الاختبارات التفصيلية.","تقديم خدمات تأكيد ومشورة مستقلة وموضوعية ومبنية على المخاطر بشأن الحوكمة وإدارة المخاطر والرقابة، مع تقديم رؤى ونظرة مستقبلية تتعلق بالمخاطر الناشئة وأهداف المؤسسة."],
answer:3,
exp:["هذا يعمّق التركيز على المعاملات التاريخية، وهو بالضبط ما لم يرضِ المجلس، ولا يعكس الغرض الحديث للتدقيق الداخلي.","إدارة المخاطر مسؤولية الإدارة؛ وتحمّل التدقيق الداخلي لها يعني تولّي مسؤوليات إدارية تُضعف استقلاليته وموضوعيته، وهو ما تمنعه المعايير.","اكتشاف الاحتيال ومنعه مسؤولية الإدارة أساسًا، وخدمة المدقق الخارجي ليست غرض التدقيق الداخلي.","يطابق غرض التدقيق الداخلي في المعايير العالمية 2024 (المجال الأول): تعزيز قدرة المؤسسة على خلق القيمة وحمايتها واستدامتها من خلال تزويد المجلس والإدارة بتأكيد ومشورة ورؤى واستشراف مستقبلي، بشكل مستقل وموضوعي ومبني على المخاطر."]},
{q:"تقوم شركة تصنيع متعددة الجنسيات بتطبيق نظام جديد لإدارة مخاطر المؤسسة. طلبت الإدارة العليا من وظيفة التدقيق الداخلي المشاركة في المشروع، ووافق الرئيس التنفيذي للتدقيق على أن يقوم المدققون الداخليون بتقييم هيكل الرقابة المقترح، وتيسير مناقشات المخاطر، وتقديم المشورة للإدارة بشأن أوجه الضعف المحتملة. إلا أن الإدارة طلبت أيضًا من التدقيق الداخلي اختيار الضوابط الرقابية النهائية، واعتماد استجابات المخاطر، والإشراف على عملية التنفيذ. أيٌّ من الإجراءات التالية يحافظ على أفضل وجه على غرض التدقيق الداخلي واستقلاليته وموضوعيته؟",
options:["الإشراف على التنفيذ بصورة مؤقتة، شريطة أن يرفع الرئيس التنفيذي للتدقيق تقارير تقدم المشروع مباشرة إلى مجلس الإدارة.","اختيار الضوابط الرقابية واعتمادها، مع ترتيب قيام المدقق الخارجي بمراجعة النظام بعد تنفيذه.","المساعدة في تقييم الضوابط الرقابية المقترحة وتقديم المشورة للإدارة، مع رفض تحمّل مسؤولية اختيار استجابات المخاطر أو الإشراف على التنفيذ.","قبول جميع المسؤوليات لأن التدقيق الداخلي يمتلك أقوى معرفة بالحوكمة وإدارة المخاطر والرقابة."],
answer:2,
exp:["الإشراف على التنفيذ مسؤولية إدارية حتى لو كان مؤقتًا، ورفع التقارير إلى المجلس لا يزيل الضرر الواقع على الموضوعية.","اختيار الضوابط واعتماد استجابات المخاطر قرارات إدارية، ومراجعة المدقق الخارجي لاحقًا لا تعالج ضعف موضوعية التدقيق الداخلي عند تدقيقه للنظام مستقبلًا.","يجوز للتدقيق الداخلي تقديم خدمات استشارية (تقييم الضوابط المقترحة وتيسير مناقشات المخاطر وتقديم المشورة) بشرط ألا يتحمّل مسؤوليات الإدارة؛ فاتخاذ القرارات وتنفيذ الاستجابات يبقى مسؤولية الإدارة، وبذلك تُصان الاستقلالية والموضوعية.","امتلاك الخبرة لا يبرر تحمّل مسؤوليات الإدارة؛ فذلك يُضعف الاستقلالية ويخلق تعارضًا عندما يُطلب من التدقيق الداخلي لاحقًا تقييم النظام نفسه."]},
{q:"استنادًا إلى تعريف معهد المدققين الداخليين (IIA) لوظيفة التدقيق الداخلي، أيٌّ من الأنشطة التالية يُعد مناسبًا لأن يقوم به المدقق الداخلي في منظمة عالمية؟",
options:["تقييم المخاطر المرتبطة بالسعي إلى دخول الأسواق العالمية.","الإشراف على تنفيذ نظام محاسبي عالمي على مستوى الكيان والدولة والأقاليم.","تقديم خدمات استشارية لمنظمات دولية أخرى، وبذلك تحويل وظيفة التدقيق الداخلي إلى مركز ربح.","ضمان أن الضوابط التي وضعتها الإدارة والمتعلقة بالسعي إلى دخول الأسواق العالمية مناسبة."],
answer:3,
exp:["تحديد وتقييم مخاطر قرار دخول الأسواق جزء من عملية إدارة المخاطر التي تملكها الإدارة؛ ودور التدقيق الداخلي هو تقييم فعالية هذه العملية لا القيام بها نيابة عن الإدارة.","الإشراف على تنفيذ الأنظمة مسؤولية إدارية تُضعف موضوعية المدقق عند تدقيق النظام لاحقًا.","خدمة جهات خارجية بهدف تحقيق الربح تقع خارج غرض التدقيق الداخلي الذي يخدم المنظمة ومجلسها وإدارتها.","تقييم مدى كفاية وفعالية الضوابط التي وضعتها الإدارة هو جوهر خدمات التأكيد وفق تعريف التدقيق الداخلي (تقييم وتحسين فعالية الحوكمة وإدارة المخاطر والرقابة)."]},
{q:"تسعى منظمة تخضع لمبادرات تحسين العمليات إلى الحصول على مدخلات من فريق التدقيق الداخلي لديها. كيف تسهم وظيفة التدقيق الداخلي في تحقيق الأهداف الاستراتيجية استنادًا إلى فوائدها العامة؟",
options:["تتعاون مع المدققين الخارجيين لدعم التقارير التنظيمية ودقة القوائم المالية بشكل مستمر.","توفر تأكيدًا مستقلًا يعزز ممارسات إدارة المخاطر، والرقابة الداخلية، وحوكمة الشركات.","تجري مراجعات متكررة للأنشطة الروتينية وتقيس أداء الموظفين للحفاظ على كفاءة العمليات بشكل منهجي.","تشرف بشكل مباشر على المهام التشغيلية وتفرض سياسات الإدارة لضمان الامتثال الفوري للعمليات بشكل موحد."],
answer:1,
exp:["التنسيق مع المدقق الخارجي مفيد، لكنه يركّز على التقارير المالية ولا يمثل المساهمة الاستراتيجية الأساسية للتدقيق الداخلي.","الفائدة الجوهرية للتدقيق الداخلي هي تقديم تأكيد مستقل وموضوعي يعزز الحوكمة وإدارة المخاطر والرقابة، مما يدعم قدرة المنظمة على تحقيق أهدافها الاستراتيجية.","مراجعة الأنشطة الروتينية وقياس أداء الموظفين مهام إشرافية تقع على عاتق الإدارة.","الإشراف المباشر على العمليات وفرض السياسات مسؤوليات إدارية تتعارض مع استقلالية التدقيق الداخلي."]},
{q:"أيٌّ مما يلي يجب أن يكون جزءًا من مهام نشاط التدقيق الداخلي؟",
options:["مساعدة الإدارة في تطوير العمليات والضوابط لإدارة المخاطر والقضايا.","توفير أطر إدارة المخاطر.","الإبلاغ النشط إلى الإدارة.","تحديد وتخفيف المخاطر الجوهرية التي تواجه المنظمة."],
answer:0,
exp:["مساعدة الإدارة وتقديم المشورة لها في تطوير العمليات والضوابط دور استشاري مشروع للتدقيق الداخلي، بشرط أن تبقى مسؤولية القرار والتنفيذ لدى الإدارة.","توفير أطر إدارة المخاطر ووضعها مسؤولية الإدارة، ودور التدقيق الداخلي هو تقييم فعاليتها.","يرفع التدقيق الداخلي نتائج مهامه إلى الإدارة والمجلس، لكن الإبلاغ المستمر عن العمليات للإدارة ليس من مهامه الأساسية.","تحديد المخاطر وتخفيفها (اختيار الاستجابات وتنفيذها) مسؤولية الإدارة، وتحمّل التدقيق الداخلي لها يُضعف موضوعيته."]},
{q:"أيٌّ من الخصائص التالية تُعدّ سمة نموذجية لوظيفة التدقيق الداخلي؟",
options:["تضمن امتثال المنظمة للقوانين واللوائح في المجال الخاضع للتدقيق.","تستجيب لاحتياجات ورغبات الإدارة العليا ومجلس الإدارة، مع الحفاظ على استقلاليتها عن المجالات الخاضعة للمراجعة.","تخدم الأطراف الخارجية التي تحتاج إلى معلومات مالية موثوقة من مهام التدقيق.","مستقلة تمامًا عن الإدارة العليا ومجلس الإدارة والمجالات الخاضعة للتدقيق."],
answer:1,
exp:["ضمان الامتثال مسؤولية الإدارة؛ والتدقيق الداخلي يقيّم ويقدّم تأكيدًا معقولًا ولا يضمن الامتثال.","يخدم التدقيق الداخلي المجلس والإدارة العليا ويستجيب لاحتياجاتهما، مع الحفاظ على استقلاليته التنظيمية وموضوعيته تجاه الأنشطة التي يدققها.","خدمة الأطراف الخارجية بمعلومات مالية موثوقة هي وظيفة التدقيق الخارجي.","التدقيق الداخلي يرفع تقاريره وظيفيًا إلى المجلس وإداريًا إلى الإدارة العليا؛ فالاستقلال التام عنهما غير ممكن ولا مطلوب."]},
{q:"تُعتبر وظيفة التدقيق الداخلي فعّالة عندما:",
options:["يتم اعتماد المدققين الداخليين بشهادات مهنية.","يتم إعداد دليل إجراءات التدقيق الداخلي.","يضيف التدقيق الداخلي قيمة للمنظمة.","يكون جميع المدققين الداخليين فعّالين."],
answer:2,
exp:["الشهادات المهنية تدعم الكفاءة لكنها لا تثبت فعالية الوظيفة.","دليل الإجراءات أداة تنظيمية مهمة، لكنه ليس مقياسًا لفعالية الوظيفة.","وفق المعايير العالمية، يكون التدقيق الداخلي فعّالًا عندما يحقق غرضه ويضيف قيمة للمنظمة ويعزز قدرتها على تحقيق أهدافها.","فعالية الأفراد لا تعني بالضرورة أن الوظيفة تحقق غرضها؛ فالعبرة بالقيمة المضافة للمنظمة."]},
{q:"إن قبول فكرة أن التدقيق الداخلي يجب أن يكون جزءًا أساسيًا من المنظمة قد يتطلب تغييرًا كبيرًا في موقف الإدارة العليا. أيٌّ مما يلي يُعدّ أفضل وسيلة لإقناع الإدارة العليا بضرورة وفوائد التدقيق الداخلي؟",
options:["إقناع الإدارة العليا بقبول فكرة التدقيق الداخلي من خلال التواصل مع المساهمين والجهات الرقابية الخارجية.","إشراك الإدارة العليا في تحديد ملاحظات التدقيق التي سيتم الإبلاغ عنها.","توعية الإدارة العليا بفوائد التدقيق الداخلي والتواصل المنتظم معهم.","التفاوض مع الإدارة العليا لتقديم مكافآت لهم، مثل تقارير تدقيق إيجابية."],
answer:2,
exp:["الضغط عبر أطراف خارجية قد يحقق قبولًا شكليًا لا قناعة حقيقية، وقد يضر بالعلاقة مع الإدارة.","إشراك الإدارة في تحديد ما يُبلَّغ عنه يُضعف الموضوعية ويقيّد حرية التدقيق الداخلي في الإبلاغ.","التوعية بالقيمة المضافة والتواصل المنتظم يبنيان الثقة والقناعة لدى الإدارة العليا، وهو الأسلوب الأفضل والمستدام.","تقديم تقارير إيجابية كمكافأة مخالفة صريحة لمبادئ النزاهة والموضوعية."]},
{q:"أيٌّ من القدرات التالية ليست مهمة في تعزيز مكانة وظيفة التدقيق الداخلي لدى الإدارة؟",
options:["شرح كيفية استخدام برامج التدقيق الحالية للإدارة التنفيذية.","فهم توقعات الإدارة التنفيذية من المدققين الداخليين.","معرفة «العملاء» الذين يخدمهم المدققون الداخليون.","إعداد تقارير التدقيق بكفاءة واحترافية."],
answer:0,
exp:["هذه هي القدرة غير المهمة: برامج التدقيق أدوات عمل داخلية تفصيلية، وشرح استخدامها للإدارة التنفيذية لا يعزز مكانة الوظيفة.","فهم توقعات الإدارة التنفيذية قدرة مهمة لتوجيه عمل التدقيق نحو ما يضيف قيمة.","معرفة أصحاب المصلحة الذين يخدمهم التدقيق الداخلي (المجلس والإدارة) قدرة مهمة لتلبية احتياجاتهم.","التقارير الواضحة والمهنية هي المنتج الأبرز للتدقيق الداخلي وتؤثر مباشرة في مكانته."]},
{q:"السبب الرئيسي لإنشاء وظيفة التدقيق الداخلي هو:",
options:["ضمان موثوقية وسلامة المعلومات المالية والتشغيلية.","حماية الموارد الموكلة إلى المنظمة.","تخفيف عبء الإدارة المثقلة بالمسؤوليات المتعلقة بإنشاء ضوابط فعّالة.","تقييم وتحسين فعالية عمليات الرقابة."],
answer:3,
exp:["موثوقية المعلومات هدف من أهداف الرقابة الداخلية التي تقيّمها الوظيفة؛ والتدقيق لا يضمنها، ومسؤوليتها على الإدارة.","حماية الأصول هدف رقابي تتحمل الإدارة مسؤوليته، ويقيّم التدقيق الداخلي مدى فعالية الضوابط الخاصة به.","إنشاء الضوابط وصيانتها مسؤولية الإدارة ولا تنتقل إلى التدقيق الداخلي.","تقييم وتحسين فعالية عمليات الرقابة (ضمن الحوكمة وإدارة المخاطر) هو جوهر تعريف التدقيق الداخلي والسبب الرئيسي لوجوده."]},
{q:"الدور التنظيمي المناسب للتدقيق الداخلي هو:",
options:["مساعدة المدقق الخارجي لتقليل أتعاب التدقيق الخارجي.","أن يعمل كذراعٍ تحقيقية للجنة التدقيق التي ترفع تقاريرها إلى مجلس الإدارة.","العمل كنشاط مستقل وموضوعي لتقديم خدمات تأكيد واستشارات تضيف قيمة للعمليات.","إجراء دراسات للمساعدة في تحقيق عمليات أكثر كفاءة."],
answer:2,
exp:["تخفيض أتعاب المدقق الخارجي فائدة جانبية محتملة وليست الدور التنظيمي للتدقيق الداخلي.","التحقيقات قد تكون جزءًا من عمل التدقيق الداخلي، لكنها لا تمثل دوره التنظيمي الشامل.","هذا هو الدور التنظيمي المناسب: نشاط تأكيدي واستشاري مستقل وموضوعي يضيف قيمة ويحسّن عمليات المنظمة.","دراسات الكفاءة جزء محدود من الخدمات الاستشارية، ولا تمثل الدور الكامل للتدقيق الداخلي."]},
{q:"أيٌّ مما يلي يصف بشكلٍ أفضل الغرض من وظيفة التدقيق الداخلي؟",
options:["فحص وتقييم نظام المحاسبة في المنظمة كخدمة للإدارة.","مراقبة نظام الرقابة الداخلية في المنظمة لصالح المدققين الخارجيين.","مساعدة أعضاء المنظمة على أداء مسؤولياتهم بفعالية.","مساعدة الإدارة في تصميم وتنفيذ أنظمة المحاسبة والرقابة."],
answer:2,
exp:["نطاق ضيق يقتصر على النظام المحاسبي ويخدم الإدارة وحدها، بينما يشمل نطاق التدقيق الداخلي الحوكمة وإدارة المخاطر والرقابة بأكملها.","خدمة المدقق الخارجي ليست غرض التدقيق الداخلي.","مساعدة أعضاء المنظمة (المجلس والإدارة) على أداء مسؤولياتهم بفعالية من خلال التأكيد والمشورة والرؤى هو جوهر غرض التدقيق الداخلي.","تصميم الأنظمة وتنفيذها مسؤولية الإدارة، وقيام المدقق بذلك يُضعف موضوعيته."]}
]}
]},

{id:7,sec:"B",title:"الكفاءة والتطوير المهني المستمر",lessons:[L("07.01","الكفاءة"),L("07.02","التطوير المهني المستمر")]},
{id:8,sec:"B",title:"العناية المهنية اللازمة، الشك المهني والسرية",lessons:[
{id:"08.01",title:"العناية المهنية اللازمة",questions:[
{q:"أيٌّ مما يلي يوضح بشكل أفضل أن نشاط التدقيق الداخلي يمارس العناية المهنية اللازمة؟",
options:["يتلقى المدققون الداخليون التدريب اللازم لإتمام أعمال التدقيق الخاصة بهم.","يقدّم نشاط التدقيق الداخلي تقاريره مباشرة إلى مجلس الإدارة عن المهام التي يقوم بها.","ينظر المدققون الداخليون في استخدام التدقيق المعتمد على التكنولوجيا وأساليب تحليل البيانات الأخرى.","يتم تنفيذ مهام التدقيق على أساس افتراض وجود أنشطة احتيالية."],
answer:2,
exp:["التدريب يتعلق بالكفاءة والتطوير المهني المستمر (المبدأ 3) وليس بالعناية المهنية اللازمة.","رفع التقارير إلى المجلس يتعلق بالاستقلالية التنظيمية (المبدأ 7) وليس بالعناية المهنية.","من متطلبات العناية المهنية اللازمة أن ينظر المدقق في استخدام التدقيق المعتمد على التكنولوجيا وتحليل البيانات عند تخطيط المهمة وتنفيذها، ضمن اختيار الأساليب والإجراءات المناسبة.","افتراض وجود احتيال يتجاوز الشك المهني المطلوب؛ فالعناية المهنية تتطلب مراعاة احتمال الاحتيال لا افتراض وجوده."]},
{q:"يجب على المدققين الداخليين ممارسة العناية المهنية اللازمة من خلال النظر في أيٍّ مما يلي؟<br>1. تكلفة خدمات التدقيق الداخلي مقارنة بالمنافع المحتملة.<br>2. مدى كفاية وفعالية عمليات الحوكمة وإدارة المخاطر والرقابة.<br>3. مستوى كفاءة الإدارة في المنطقة التي يتم تقييمها.<br>4. احتمال وقوع أخطاء جوهرية أو احتيال أو عدم امتثال.",
options:["1 و2 و4 فقط.","1 و2 فقط.","2 و3 و4 فقط.","1 و2 و3 فقط."],
answer:0,
exp:["العناصر التي تنص عليها المعايير (المعيار 4.2) تشمل: التكلفة مقارنة بالمنافع، وكفاية وفعالية الحوكمة وإدارة المخاطر والرقابة، واحتمال الأخطاء الجوهرية والاحتيال وعدم الامتثال، إضافة إلى الأهداف والنطاق والتعقيد والأهمية النسبية وأساليب التدقيق.","ناقص؛ يُغفل احتمال وقوع الأخطاء الجوهرية والاحتيال وعدم الامتثال، وهو عنصر أساسي في العناية المهنية.","تقييم مستوى كفاءة الإدارة ليس من العناصر التي تنص عليها المعايير، كما يُغفل الخيار عنصر التكلفة والمنفعة.","يتضمن عنصرًا غير وارد في المعايير (كفاءة الإدارة) ويُغفل احتمال الأخطاء والاحتيال وعدم الامتثال."]},
{q:"لممارسة العناية المهنية اللازمة عند تخطيط وتنفيذ المهمة، ينبغي للمدقق الداخلي:",
options:["مراعاة احتمال وقوع أخطاء جوهرية أو احتيال أو عدم امتثال أو مخاطر أخرى قد تؤثر في الأهداف أو العمليات أو الموارد.","إبلاغ مجلس الإدارة فورًا بكل تجاوز يتم اكتشافه.","التأكد من توثيق كل اختبار تدقيق بصورة كاملة بغض النظر عن أهميته.","فحص جميع المعلومات المالية المتعلقة بالمهمة."],
answer:0,
exp:["هذا نص متطلبات العناية المهنية اللازمة: مراعاة احتمال الأخطاء الجوهرية والاحتيال وعدم الامتثال والمخاطر الأخرى التي قد تؤثر في الأهداف أو العمليات أو الموارد.","الإبلاغ يتم وفق أهمية المسألة وإجراءات الاتصال المعتمدة، وليس كل تجاوز يُرفع فورًا إلى المجلس.","التوثيق يكون كافيًا لدعم النتائج ومتناسبًا مع الأهمية، وليس شاملًا لكل تفصيل بغض النظر عن أهميته.","العناية المهنية لا تعني الفحص الشامل لكل المعلومات؛ فالمدقق يعتمد على تقييم المخاطر والعينات."]},
{q:"فيما يتعلق بممارسة العناية المهنية اللازمة، يجب على المدقق الداخلي:",
options:["مراعاة التعقيد النسبي والأهمية النسبية وأهمية المخاطر والمسائل التي يتم تقييمها.","التركيز على المنافع المحتملة من أعمال التدقيق بغض النظر عن تكاليفها.","تحديد ما إذا كان يتم تحقيق المعايير التشغيلية الموضوعة، وليس ما إذا كانت تلك المعايير مقبولة.","اختيار إجراءات تدقيق توفر تأكيدًا مطلقًا بعدم وجود تجاوزات."],
answer:0,
exp:["من عناصر العناية المهنية اللازمة مراعاة مدى تعقيد المهمة وأهميتها النسبية وأهمية المخاطر والمسائل محل التقييم.","العناية المهنية تتطلب الموازنة بين التكلفة والمنفعة، لا تجاهل التكلفة.","على المدقق أيضًا تقييم مدى ملاءمة المعايير (Criteria) المستخدمة نفسها وليس فقط مدى تحقيقها.","العناية المهنية لا تعني العصمة؛ فالتدقيق يقدّم تأكيدًا معقولًا وليس مطلقًا."]},
{q:"أيٌّ من العبارات التالية صحيحة فيما يتعلق بالعناية المهنية اللازمة؟",
options:["يجب أن ينفذ المدقق اختبارات تفصيلية على جميع العمليات قبل تقديم التقرير.","لا ينبغي ذكر أي عنصر في تقرير ما لم يكن المدقق متأكدًا تمامًا من ذلك العنصر.","لا ينبغي النظر إلى تقرير التدقيق باعتباره يقدّم حقيقة لا شك فيها أبدًا حول الموضوع.","لا يتحمل المدقق أي مسؤولية بشأن اقتراح التحسينات."],
answer:2,
exp:["الاختبار التفصيلي الشامل لجميع العمليات غير مطلوب ولا عملي؛ فالعناية المهنية لا تعني الفحص الكامل.","المعيار هو الأدلة الكافية والموثوقة التي توفر تأكيدًا معقولًا، وليس اليقين التام.","العناية المهنية اللازمة لا تعني العصمة من الخطأ؛ فالتدقيق يقدّم تأكيدًا معقولًا لا مطلقًا، لذا لا يُعد التقرير حقيقة قاطعة لا يرقى إليها الشك.","تقديم التوصيات والاقتراحات لتحسين العمليات جزء أصيل من دور التدقيق الداخلي."]},
{q:"عند التخطيط لمهمة لمعالجة مخاطر مهمة، كيف يمكن للمدقق الداخلي إظهار العناية المهنية اللازمة؟",
options:["باتباع خطة مهمة محددة مسبقًا دون تقييم التوازن الحالي بين التكلفة والمنفعة.","ببدء المهمة فورًا لأن المخاطر مهمة بغض النظر عن اعتبارات التكلفة.","بتقييم ما إذا كانت تكلفة المهمة مبرَّرة بالمنافع المحتملة الناتجة عن خفض تلك المخاطر.","بتأجيل المهمة حتى تتوفر أموال إضافية حتى لو أدى ذلك إلى زيادة التعرض للمخاطر."],
answer:2,
exp:["الاعتماد على خطة جاهزة دون إعادة تقييم التكلفة والمنفعة يتعارض مع العناية المهنية.","تجاهل التكلفة يخالف متطلب الموازنة بين تكلفة التدقيق ومنافعه المحتملة.","من عناصر العناية المهنية اللازمة النظر في التكلفة النسبية للتدقيق مقارنة بالمنافع المحتملة، ومنها خفض المخاطر.","تأجيل معالجة مخاطر مهمة مع زيادة التعرض لها لا يعكس حكمًا مهنيًا سليمًا."]},
{q:"كيف يمكن للمدقق الداخلي التأكد من أن تصميم المهمة يعكس ممارسة العناية المهنية اللازمة؟",
options:["بالاعتماد على تصميمات المهام السابقة دون إعادة تقييم ديناميكيات التكلفة والمنفعة الحالية.","بتصميم أنشطة المهمة بحيث تبقى التكاليف منخفضة حتى لو أدى ذلك إلى تقليل المنافع المحتملة من تحديد المخاطر.","بتصميم المهمة لتغطي كل مجال مخاطر ممكن بغض النظر عن الآثار المالية.","بتصميم المهمة لتغطي المخاطر المحتملة التي قد يكون لها أثر جوهري."],
answer:3,
exp:["إعادة استخدام التصميمات السابقة دون تقييم الظروف الحالية تخالف العناية المهنية.","خفض التكلفة على حساب المنافع وتحديد المخاطر يُخل بالتوازن المطلوب.","تغطية كل المخاطر الممكنة غير عملية وتتجاهل اعتبارات التكلفة والمنفعة.","العناية المهنية تتطلب تركيز المهمة على المخاطر الجوهرية (النهج المبني على المخاطر) مع مراعاة الأهمية النسبية والتكلفة والمنفعة."]},
{q:"أيٌّ مما يلي يُعد مثالًا على ممارسة المدقق الداخلي للعناية المهنية اللازمة؟",
options:["يقدّم المدقق تأكيدًا مطلقًا بأن حالات عدم الالتزام أو المخالفات غير موجودة.","يراعي المدقق احتمال وجود مخالفات جوهرية أو حالات عدم التزام في أي مهمة تدقيق داخلي.","يجري المدقق الفحوصات والتحققات إلى أقصى مدى ممكن.","يتحقق المدقق من المخالفات الجوهرية أو حالات عدم الالتزام فقط إذا كان احتمال حدوثها مرتفعًا."],
answer:1,
exp:["التأكيد المطلق غير ممكن؛ فالعناية المهنية لا تعني العصمة.","مراعاة احتمال وجود مخالفات جوهرية وعدم التزام في كل مهمة هي من صميم العناية المهنية اللازمة.","العناية المهنية لا تتطلب فحوصات شاملة بلا حدود، بل إجراءات معقولة تتناسب مع المخاطر والتكلفة.","يجب مراعاة الاحتمال في كل مهمة، وليس فقط عندما يكون مرتفعًا."]},
{q:"طلب الرئيس التنفيذي للتدقيق الداخلي من مدققة داخلية جديدة أن تتعرف على أحد القوانين الضريبية وأي تطورات جديدة مرتبطة به، بهدف تحديد حالات عدم الامتثال خلال عمليات التدقيق القادمة. أيٌّ من السمات التالية يؤكد عليها الرئيس التنفيذي للتدقيق الداخلي بهذا الطلب؟",
options:["النزاهة.","السرية.","العناية المهنية اللازمة.","الموضوعية."],
answer:2,
exp:["النزاهة تتعلق بالصدق والشجاعة المهنية والسلوك الأخلاقي، ولا علاقة لها بفهم القوانين لاكتشاف عدم الامتثال.","السرية تتعلق بحماية المعلومات وعدم استخدامها لأغراض شخصية، وليست محور هذا الطلب.","فهم القوانين ذات الصلة لتمكين المدقق من مراعاة احتمال عدم الامتثال وكشفه هو تطبيق مباشر للعناية المهنية اللازمة.","الموضوعية تتعلق بالحياد وتجنب التحيز وتعارض المصالح، وليست محور هذا الطلب."]},
{q:"ما الذي يجب على المدقق الداخلي القيام به دائمًا لضمان ممارسة العناية المهنية اللازمة أثناء المهمة؟",
options:["الإبلاغ فورًا إلى لجنة التدقيق عن أي حالات عدم التزام أو مخالفات يتم اكتشافها.","التأكد من مراجعة جميع المعلومات المالية وإدراجها في خطة التدقيق.","النظر في احتمال وجود حالات عدم التزام أو مخالفات أثناء المهمة.","توثيق جميع اختبارات التدقيق والإجراءات المرتبطة بها بالكامل في أوراق العمل."],
answer:2,
exp:["الإبلاغ يتم وفق أهمية المسألة وقنوات الاتصال المناسبة، وليس فورًا إلى لجنة التدقيق في كل حالة.","مراجعة جميع المعلومات المالية غير مطلوبة؛ فالنطاق يُحدَّد بناءً على المخاطر.","النظر في احتمال وجود عدم التزام أو مخالفات مطلوب دائمًا في كل مهمة كجزء من العناية المهنية اللازمة.","التوثيق يجب أن يكون كافيًا لدعم النتائج، لكن التوثيق الكامل لكل شيء ليس هو جوهر العناية المهنية."]},
{q:"أيٌّ من العبارات التالية صحيحة فيما يتعلق بالعناية المهنية اللازمة؟",
options:["يُتوقع من المدققين الداخليين ألا يخطئوا مطلقًا.","يُتوقع من المدققين الداخليين تقديم تأكيد مطلق بأن حالات عدم الالتزام موجودة.","يُتوقع من المدققين الداخليين التصرف بمستوى معقول من الحيطة والحذر المهني.","يُتوقع من المدققين الداخليين تقديم تأكيد مشروط بأن المخالفات موجودة."],
answer:2,
exp:["العناية المهنية لا تعني العصمة من الخطأ.","التأكيد المطلق غير ممكن في التدقيق؛ والتأكيد يكون معقولًا.","العناية المهنية اللازمة تعني تطبيق العناية والمهارة المتوقعة من مدقق داخلي حصيف وكفء، أي مستوى معقول من الحيطة والحذر المهني.","لا يقدّم المدقق تأكيدًا بوجود مخالفات؛ بل يقدّم تأكيدًا معقولًا بناءً على الأدلة."]},
{q:"ما الاستجابة المعقولة من وظيفة التدقيق الداخلي عند التحضير لمهمة تأكيد على فرع تابع لمنظمة غير هادفة للربح متخصص في القروض الصغيرة، في حين تعتقد الإدارة العليا أن احتمال وقوع احتيال جوهري منخفض وتفضّل عدم تضمين ضوابط الاحتيال حتى لا تسيء إلى مديري الفرع وموظفيه؟",
options:["الحصول على مدخلات المديرين المحليين قبل الانتهاء من تحديد نطاق العمل لهذه المهمة.","قبول أن من صلاحيات الإدارة العليا استبعاد الاحتيال من نطاق التدقيق.","التحضير للمهمة من خلال البحث في سيناريوهات الاحتيال المحتملة، وإدراج تقييم مخاطر الاحتيال والتدابير الرقابية المحتملة كأحد أهداف التدقيق.","الانتظار حتى وصول فريق التدقيق إلى الموقع ثم تقييم البيئة الأخلاقية لموظفي الفرع."],
answer:2,
exp:["مدخلات المديرين مفيدة، لكنها لا تعالج ضغط الإدارة لاستبعاد الاحتيال، ومديرو الفرع هم موضع المخاطر نفسها.","قبول استبعاد الاحتيال من النطاق بطلب الإدارة يُعد قيدًا على النطاق ويُخل بالعناية المهنية والاستقلالية.","العناية المهنية تتطلب مراعاة احتمال الاحتيال في كل مهمة؛ والبحث في سيناريوهات الاحتيال وإدراج تقييم مخاطره وضوابطه ضمن الأهداف هو الاستجابة المهنية الصحيحة، خاصة في نشاط نقدي كالقروض الصغيرة.","تأجيل النظر في الاحتيال إلى مرحلة العمل الميداني يعني تخطيطًا قاصرًا لا يعكس العناية المهنية."]},
{q:"تمنع قيود الموارد أحد المدققين الداخليين من تنفيذ جميع الإجراءات المخطط لها أصلًا. أي استجابة تعكس بصورة أفضل ممارسة العناية المهنية اللازمة؟",
options:["الانتظار حتى التقييم الخارجي التالي للجودة لتقييم الأثر.","الاستمرار في الاستنتاج الأصلي دون مراعاة الإجراءات التي لم يتم تنفيذها.","تقييم أثر القيد على أهداف المهمة ومخاطرها، وتحديد ما إذا كانت هناك حاجة إلى إجراءات بديلة، والإفصاح عن القيد حسب الاقتضاء.","تقليص النطاق لمجرد الالتزام بالموعد النهائي."],
answer:2,
exp:["تأجيل التقييم إلى التقييم الخارجي للجودة يترك الاستنتاجات الحالية بدون أساس كافٍ.","إصدار الاستنتاج دون أدلة كافية يخالف العناية المهنية ويُضلّل مستخدمي التقرير.","العناية المهنية تتطلب تقييم أثر القيد على الأهداف والمخاطر، والنظر في إجراءات بديلة، والإفصاح عن القيود في الاتصالات عند الاقتضاء.","تقليص النطاق دون تقييم أثره أو الإفصاح عنه يُخل بالعناية المهنية."]},
{q:"أيُّ تصرف يوضح بصورة أوضح الإخفاق في ممارسة العناية المهنية اللازمة؟",
options:["عدم مراعاة تكلفة مهمة استشارية مقترحة تتعلق بالتكنولوجيا مقارنة بالمنافع المحتملة منها.","استخدام تقييم المخاطر لترتيب أولويات المهام عندما تكون الموارد محدودة.","مناقشة مسودات تواصلات المهمة مع الإدارة للحصول على مدخلات تتعلق بالوقائع.","المشاركة في فريق تطوير بصفة استشارية لمراجعة الضوابط المقترحة دون تحمّل مسؤولية إدارية."],
answer:0,

/* ======== منطق البرنامج ======== */
const app=document.getElementById("app"),timerEl=document.getElementById("timer");
const SB={A:"أ",B:"ب",C:"ج",D:"د"};
let state=null,timerId=null,pending=null;
const DB=JSON.parse(localStorage.getItem("cia_db")||"{}");
if(!DB.qa)DB.qa={};if(!DB.mocks)DB.mocks=0;
function save(){localStorage.setItem("cia_db",JSON.stringify(DB));}
const ALL=[];
CHAPTERS.forEach(function(ch){ch.lessons.forEach(function(l){l.questions.forEach(function(q,i){ALL.push({q:q,key:l.id+"-"+(i+1),cid:ch.id,lid:l.id,sec:ch.sec});});});});
function qsOf(f){return ALL.filter(f);}
function isWrong(x){const r=DB.qa[x.key];return !!r&&!r.last;}
function statOf(list){let att=0,ok=0;list.forEach(function(x){const r=DB.qa[x.key];if(r){att++;if(r.last)ok++;}});return {n:list.length,att:att,ok:ok,pct:att?Math.round(ok/att*100):0};}
function findLesson(id){for(const c of CHAPTERS){for(const l of c.lessons){if(l.id===id)return l;}}return null;}
function crumb(parts){return '<div class="breadcrumb">'+parts.join(' › ')+'</div>';}
const HOME='<a onclick="goHome()">الرئيسية</a>';

/* ---- التفضيلات: الوضع الليلي وحجم الخط ---- */
let fs=parseInt(localStorage.getItem("cia_fs")||"16");
function applyPrefs(){document.documentElement.style.setProperty("--fs",fs+"px");const d=localStorage.getItem("cia_dark")==="1";document.body.classList.toggle("dark",d);document.getElementById("themeBtn").textContent=d?"☀️":"🌙";}
function toggleDark(){localStorage.setItem("cia_dark",document.body.classList.contains("dark")?"0":"1");applyPrefs();}
function zoom(d){fs=Math.min(22,Math.max(12,fs+d));localStorage.setItem("cia_fs",fs);applyPrefs();}

/* ---- المؤقت ---- */
function fmt(s){const m=Math.floor(s/60),x=s%60;return (m<10?"0":"")+m+":"+(x<10?"0":"")+x;}
function stopTimer(){clearInterval(timerId);timerId=null;timerEl.style.display="none";timerEl.classList.remove("warn");}
function startTimer(){
 timerEl.style.display="block";timerEl.textContent=fmt(state.remaining);
 timerId=setInterval(function(){
  state.remaining--;timerEl.textContent=fmt(Math.max(state.remaining,0));
  if(state.remaining<=60)timerEl.classList.add("warn");
  if(state.remaining<=0){finish(true);}
 },1000);
}

/* ---- الصفحة الرئيسية ---- */
function mode(i,bg,t,d,fn){return '<div class="mode" onclick="'+fn+'"><div class="ico" style="background:'+bg+'">'+i+'</div><h4>'+t+'</h4><p>'+d+'</p></div>';}
function home(){
 stopTimer();state=null;
 const s=statOf(ALL),rev=ALL.filter(isWrong).length,hr=new Date().getHours();
 let h='<div class="panel"><div class="hello">'+(hr<12?'صباح الخير ☀️':'مساء الخير 👋')+'</div><h2>تقدّمك</h2><div class="stats4">'+
 '<div class="stat"><b>'+s.att+'</b><span>من '+s.n+' سؤال تمت محاولته</span></div>'+
 '<div class="stat"><b>'+s.pct+'%</b><span>الدقة الإجمالية</span></div>'+
 '<div class="stat"><b class="red">'+rev+'</b><span>سؤال للمراجعة</span></div>'+
 '<div class="stat"><b>'+DB.mocks+'</b><span>اختبار تجريبي منجز</span></div></div>'+
 '<h3 class="sub">التقدم حسب القسم</h3>';
 Object.keys(SECTIONS).forEach(function(k){
  const sec=SECTIONS[k],st=statOf(qsOf(function(x){return x.sec===k;}));
  h+='<div class="drow"><div class="badge">'+SB[k]+'</div><div class="dmid"><div class="t">'+sec.name+' <small>('+st.n+' سؤال • الوزن '+sec.w+')</small></div><div class="bar"><span style="width:'+(st.n?st.att/st.n*100:0)+'%"></span></div></div><div class="dnum">'+st.att+'/'+st.n+' • '+st.pct+'% صحيحة</div></div>';
 });
 h+='</div><div class="modes">'+
 mode('📚','#e7f5ff','التدريب حسب الفصل','تدرّب على جميع أسئلة فصل كامل مع تصحيح فوري وتفسير لكل خيار.','byChapter()')+
 mode('🏷️','#fff4e6','التدريب حسب الموضوع','اختر موضوعًا محددًا داخل أي فصل وابدأ التدريب عليه مباشرة.','byTopic()')+
 mode('🔁','#ebfbee','مراجعة الأخطاء','أعد حل الأسئلة التي أخطأت فيها سابقًا حتى تتقنها.','setup(\'wrong\')')+
 mode('⏱️','#fff0f0','اختبار تجريبي','أسئلة عشوائية مؤقتة من جميع الفصول، والنتيجة والتفسيرات بعد الإنهاء كالاختبار الحقيقي.','setup(\'mock\')')+
 '</div><p style="text-align:center;margin-top:20px"><a class="link" onclick="resetAll()">إعادة تعيين التقدم</a></p>';
 app.innerHTML=h;
}
function goHome(){if(state&&!state.done&&!confirm("هل تريد الخروج من الاختبار؟ سيتم فقدان تقدمك."))return;home();}
function resetAll(){if(!confirm("سيتم حذف جميع بيانات التقدم والإحصائيات. هل أنت متأكد؟"))return;DB.qa={};DB.mocks=0;save();home();}

/* ---- التدريب حسب الفصل ---- */
function byChapter(){
 stopTimer();state=null;
 let h=crumb([HOME,'التدريب حسب الفصل']);
 Object.keys(SECTIONS).forEach(function(k){
  h+='<div class="secbar"><span>'+SECTIONS[k].name+'</span><span class="w">'+SECTIONS[k].w+'</span></div><div class="chgrid">';
  CHAPTERS.filter(function(c){return c.sec===k;}).forEach(function(c){
   const st=statOf(qsOf(function(x){return x.cid===c.id;}));
   h+='<div class="ch'+(st.n?'':' empty')+'"'+(st.n?' onclick="setup(\'ch\','+c.id+')"':'')+'><span class="num">الفصل '+c.id+'</span><h4>'+c.title+'</h4><p>'+c.lessons.length+' موضوع • '+st.n+' سؤال'+(st.att?' • '+st.pct+'% صحيحة':'')+'</p><div class="bar"><span style="width:'+(st.n?st.att/st.n*100:0)+'%"></span></div></div>';
  });
  h+='</div>';
 });
 app.innerHTML=h;
}

/* ---- التدريب حسب الموضوع ---- */
function byTopic(open){
 stopTimer();state=null;
 let h=crumb([HOME,'التدريب حسب الموضوع']);
 CHAPTERS.forEach(function(c){
  const st=statOf(qsOf(function(x){return x.cid===c.id;}));
  h+='<details class="acc"'+(open===c.id?' open':'')+'><summary><span class="num">الفصل '+c.id+'</span> '+c.title+' <small>('+st.n+' سؤال)</small></summary>';
  c.lessons.forEach(function(l,i){
   const ls=statOf(qsOf(function(x){return x.lid===l.id;}));
   h+='<div class="item"><div><b>الموضوع '+(i+1)+': '+l.title+'</b><div class="mut">'+l.id+' • '+ls.n+' سؤال'+(ls.att?' • تمت محاولة '+ls.att+'/'+ls.n+' • '+ls.pct+'% صحيحة':'')+'</div></div><button class="btn sm"'+(ls.n?' onclick="setup(\'lesson\',\''+l.id+'\')"':' disabled')+'>'+(ls.n?'ابدأ':'قريبًا')+'</button></div>';
  });
  h+='</details>';
 });
 app.innerHTML=h;
}

/* ---- إعداد الاختبار ---- */
function pool(kind,arg){
 if(kind==='ch'){const c=CHAPTERS.find(function(x){return x.id===arg;});return {title:'الفصل '+c.id+': '+c.title,list:qsOf(function(x){return x.cid===arg;}),back:'byChapter()'};}
 if(kind==='lesson'){const l=findLesson(arg);return {title:l.id+' - '+l.title,list:qsOf(function(x){return x.lid===arg;}),back:'byTopic('+parseInt(arg)+')'};}
 if(kind==='wrong')return {title:'مراجعة الأخطاء',list:ALL.filter(isWrong),back:'home()'};
 return {title:'اختبار تجريبي',list:ALL.slice(),back:'home()',mock:true};
}
function setup(kind,arg){
 stopTimer();state=null;
 const p=pool(kind,arg),n=p.list.length;pending=p;
 if(!n){app.innerHTML=crumb([HOME,p.title])+'<div class="panel"><h2>'+p.title+'</h2><p class="mut">'+(kind==='wrong'?'لا توجد أسئلة للمراجعة حاليًا 🎉 أحسنت!':'لا توجد أسئلة متاحة هنا حاليًا.')+'</p><button class="btn light" onclick="home()">العودة للرئيسية</button></div>';return;}
 const def=p.mock?Math.min(n,25):n;
 app.innerHTML=crumb([HOME,p.title])+'<div class="panel"><h2>'+p.title+'</h2><p class="mut">'+(p.mock?'أسئلة عشوائية من جميع الفصول. تظهر الإجابات الصحيحة والتفسيرات بعد إنهاء الاختبار.':'تصحيح فوري: تظهر الإجابة الصحيحة بالأخضر والخاطئة بالأحمر مع التفسير تحت كل خيار.')+'</p>'+
 '<div class="field"><label>عدد الأسئلة (المتاح '+n+'):</label><input type="number" id="cnt" min="1" max="'+n+'" value="'+def+'" oninput="document.getElementById(\'mins\').value=Math.max(1,Math.ceil(this.value*MIN_PER_Q))"></div>'+
 '<div class="field"><label>مدة الاختبار (بالدقائق):</label><input type="number" id="mins" min="0" value="'+Math.max(1,Math.ceil(def*MIN_PER_Q))+'"><span class="mut">(0 = بدون مؤقت)</span></div>'+
 '<div class="field"><label><input type="checkbox" id="shuf" style="width:auto"'+(p.mock||kind==='wrong'?' checked':'')+'> ترتيب الأسئلة عشوائيًا</label></div>'+
 '<button class="btn" onclick="start()">بدء الاختبار</button> <button class="btn light" onclick="'+p.back+'">رجوع</button></div>';
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function start(){
 const p=pending;let list=p.list.slice();
 const cnt=Math.min(list.length,Math.max(1,parseInt(document.getElementById("cnt").value)||list.length));
 const mins=parseFloat(document.getElementById("mins").value)||0;
 if(document.getElementById("shuf").checked||(p.mock&&cnt<list.length))shuffle(list);
 list=list.slice(0,cnt);
 state={title:p.title,mock:!!p.mock,back:p.back,list:list,cur:0,answers:{},remaining:Math.round(mins*60),done:false};
 if(mins>0)startTimer();
 render();
}

/* ---- شاشة السؤال ---- */
function rec(it,j){const r=DB.qa[it.key]||{n:0,c:0};r.n++;const ok=j===it.q.answer;if(ok)r.c++;r.last=ok;DB.qa[it.key]=r;save();}
function counts(){let ok=0,bad=0;Object.keys(state.answers).forEach(function(k){if(state.answers[k]===state.list[k].q.answer)ok++;else bad++;});return {ok:ok,bad:bad,total:state.list.length};}
function render(){
 const it=state.list[state.cur],q=it.q,ans=state.answers[state.cur];
 const reveal=state.done||(!state.mock&&ans!==undefined),showScore=state.done||!state.mock;
 const c=counts();
 let h=crumb([HOME,state.title+(state.done?' (مراجعة)':'')])+'<div class="exam"><div class="panel">';
 h+='<div class="progress"><span style="width:'+((state.cur+1)/c.total*100)+'%"></span></div>';
 h+='<div class="qhead"><span>السؤال '+(state.cur+1)+' من '+c.total+'<span class="tag">'+it.lid+'</span></span><span>'+(reveal?(ans===q.answer?'<b class="pass">إجابة صحيحة ✔</b>':(ans===undefined?'<b class="fail">لم تتم الإجابة</b>':'<b class="fail">إجابة خاطئة ✘</b>')):'')+'</span></div>';
 h+='<div class="qtext">'+q.q+'</div>';
 q.options.forEach(function(o,j){
  let cls="opt";
  if(reveal){cls+=" locked";if(j===q.answer)cls+=" correct";else if(j===ans)cls+=" wrong";}
  else if(ans===j)cls+=" sel";
  h+='<div class="'+cls+'" onclick="choose('+j+')"><div class="row"><span class="letter">'+LETTERS[j]+'</span><span>'+o+'</span></div>';
  if(reveal){const right=j===q.answer;h+='<div class="exp '+(right?'ok':'bad')+'"><b>'+(right?'✔ صح: ':'✘ خطأ: ')+'</b>'+q.exp[j]+'</div>';}
  h+='</div>';
 });
 h+='<div class="nav"><button class="btn light" onclick="go(-1)"'+(state.cur===0?' disabled':'')+'>→ السابق</button>';
 h+=(state.cur<c.total-1)?'<button class="btn" onclick="go(1)">التالي ←</button>':(state.done?'<button class="btn" onclick="showResult()">عرض النتيجة</button>':'<button class="btn danger" onclick="finish(false)">إنهاء الاختبار</button>');
 h+='</div></div><div class="panel side"><b>خريطة الأسئلة</b><div class="palette">';
 state.list.forEach(function(x,i){
  const a=state.answers[i];let pc="pbtn";
  if(a!==undefined)pc+=showScore?((a===x.q.answer)?" ok":" bad"):" ans";
  if(i===state.cur)pc+=" cur";
  h+='<button class="'+pc+'" onclick="jump('+i+')">'+(i+1)+'</button>';
 });
 h+='</div><div class="s"><span>تمت الإجابة</span><b>'+(c.ok+c.bad)+' / '+c.total+'</b></div>';
 if(showScore)h+='<div class="s"><span>صحيحة</span><b class="pass">'+c.ok+'</b></div><div class="s"><span>خاطئة</span><b class="fail">'+c.bad+'</b></div>';
 h+='<br>'+(state.done?'<button class="btn light" style="width:100%" onclick="'+state.back+'">العودة</button>':'<button class="btn danger" style="width:100%" onclick="finish(false)">إنهاء الاختبار</button>');
 h+='</div></div>';
 app.innerHTML=h;
}
function choose(j){
 if(state.done)return;
 if(state.mock){state.answers[state.cur]=j;}
 else{if(state.answers[state.cur]!==undefined)return;state.answers[state.cur]=j;rec(state.list[state.cur],j);}
 render();
}
function go(d){state.cur=Math.min(Math.max(state.cur+d,0),state.list.length-1);render();}
function jump(i){state.cur=i;render();}

/* ---- النتيجة ---- */
function finish(auto){
 const c=counts(),answered=c.ok+c.bad;
 if(!auto&&answered<c.total&&!confirm("لم تُجب على "+(c.total-answered)+" سؤال. هل تريد إنهاء الاختبار؟"))return;
 stopTimer();
 if(state.mock){Object.keys(state.answers).forEach(function(k){rec(state.list[k],state.answers[k]);});DB.mocks++;save();}
 state.done=true;
 if(auto)alert("انتهى وقت الاختبار!");
 showResult();
}
function showResult(){
 stopTimer();
 const c=counts(),pct=Math.round(c.ok/c.total*100),passed=pct>=PASS_MARK;
 const by={};
 state.list.forEach(function(x,i){if(!by[x.cid])by[x.cid]={n:0,ok:0};by[x.cid].n++;if(state.answers[i]===x.q.answer)by[x.cid].ok++;});
 let rows='';
 Object.keys(by).forEach(function(k){const b=by[k],ch=CHAPTERS.find(function(x){return x.id==k;}),p=Math.round(b.ok/b.n*100);rows+='<div class="drow"><div class="badge">'+k+'</div><div class="dmid"><div class="t">'+ch.title+' <small>('+b.ok+'/'+b.n+')</small></div><div class="bar"><span style="width:'+p+'%"></span></div></div><div class="dnum">'+p+'%</div></div>';});
 app.innerHTML=crumb([HOME,state.title,'النتيجة'])+
 '<div class="panel result"><h2>نتيجة: '+state.title+'</h2>'+
 '<div class="score '+(passed?'pass':'fail')+'">'+pct+'%</div>'+
 '<h3 class="'+(passed?'pass':'fail')+'">'+(passed?'ناجح 🎉':'لم تحقق درجة النجاح')+'</h3>'+
 '<p>الصحيحة: <b class="pass">'+c.ok+'</b> • الخاطئة: <b class="fail">'+c.bad+'</b> • بدون إجابة: <b>'+(c.total-c.ok-c.bad)+'</b></p>'+
 '<p class="mut">درجة النجاح المعتمدة في المحاكي: '+PASS_MARK+'%</p>'+
 '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
 '<button class="btn" onclick="review()">مراجعة الإجابات</button>'+
 '<button class="btn light" onclick="'+state.back+'">العودة</button>'+
 '<button class="btn light" onclick="home()">الرئيسية</button></div></div>'+
 '<div class="panel"><h3 class="sub">الأداء حسب الفصل</h3>'+rows+'</div>';
}
function review(){state.cur=0;render();}

document.getElementById("qcount").textContent=ALL.length+" سؤال";
applyPrefs();
home();
</script>
</body>
</html>
